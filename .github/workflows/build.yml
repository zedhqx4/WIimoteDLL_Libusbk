name: Build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.arch }} / MSVC
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            triplet: x86-windows
            cmake_arch: Win32
          - arch: x64
            triplet: x64-windows
            cmake_arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libusb
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) {
            $vcpkg = "C:\vcpkg"
          }
          & "$vcpkg\vcpkg.exe" install "libusb:${{ matrix.triplet }}"
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure
        run: >
          cmake -S . -B build
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel
